name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Verify UI contracts
        run: npm run verify:ui
      - name: Verify API contracts
        run: npm run verify:api
      - name: Verify directory trust
        run: npm run verify:directory-trust
      - name: Verify contact measurement
        run: npm run verify:contact-measurement
      - name: Verify public content claims
        run: npm run verify:content-claims
      - name: Verify database migrations
        run: npm run verify:migrations
      - name: Build
        run: npm run build
